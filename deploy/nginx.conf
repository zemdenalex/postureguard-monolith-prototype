# PostureGuard Nginx Configuration
# /etc/nginx/sites-available/postureguard

server {
    listen 80;
    server_name easy-posture.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name easy-posture.site;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/easy-posture.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easy-posture.site/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Root directory
    root /var/www/postureguard;
    index index.html;

    # SPA routing - все пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статики
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
